[package]
name = "finplan_mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for FinPlan scenario YAML construction"

[lib]
name = "finplan_mcp"
path = "src/lib.rs"

[[bin]]
name = "finplan-mcp"
path = "src/main.rs"

[dependencies]
# Internal
finplan = { path = "../finplan" }

# MCP SDK
rmcp = { version = "0.17", features = [
    "server",
    "transport-io",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { workspace = true }
serde_json = "1"
serde-saphyr = "0.0.15"

# JSON Schema generation (required by rmcp #[tool] macro)
schemars = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
