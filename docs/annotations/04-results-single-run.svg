<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- annotation overlay only — composited onto raw PNG via magick composite -->

  <!-- 1: Net Worth Projection chart (top-left large) -->
  <rect x="13" y="30" width="1127" height="380" fill="rgba(80,250,123,0.08)" stroke="#50fa7b" stroke-width="2" rx="2"/>
  <circle cx="26" cy="58" r="11" fill="#50fa7b"/>
  <text x="26" y="62" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="12" font-weight="bold">1</text>
  <rect x="38" y="50" width="206" height="18" fill="#50fa7b" rx="3"/>
  <text x="141" y="63" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="11">Net worth projection by year</text>

  <!-- 2: Account Breakdown (top-right) -->
  <rect x="1142" y="30" width="445" height="380" fill="rgba(139,233,253,0.08)" stroke="#8be9fd" stroke-width="2" rx="2"/>
  <circle cx="1155" cy="58" r="11" fill="#8be9fd"/>
  <text x="1155" y="62" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="12" font-weight="bold">2</text>
  <rect x="1167" y="50" width="180" height="18" fill="#8be9fd" rx="3"/>
  <text x="1257" y="63" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="11">Account breakdown</text>

  <!-- arrow pointing to success rate in status bar area -->
  <line x1="26" y1="418" x2="26" y2="400" stroke="#50fa7b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="13" y="418" width="280" height="18" fill="#50fa7b" rx="3"/>
  <text x="153" y="431" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="11">h/l to scroll years, r to re-run</text>

  <!-- 3: Yearly Breakdown table (bottom-left) -->
  <rect x="13" y="415" width="712" height="445" fill="rgba(255,184,108,0.08)" stroke="#ffb86c" stroke-width="2" rx="2"/>
  <circle cx="26" cy="450" r="11" fill="#ffb86c"/>
  <text x="26" y="454" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="12" font-weight="bold">3</text>
  <rect x="38" y="442" width="186" height="18" fill="#ffb86c" rx="3"/>
  <text x="131" y="455" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="11">Yearly income / expense</text>

  <!-- 4: Ledger (bottom-right) -->
  <rect x="727" y="415" width="860" height="445" fill="rgba(189,147,249,0.08)" stroke="#bd93f9" stroke-width="2" rx="2"/>
  <circle cx="740" cy="450" r="11" fill="#bd93f9"/>
  <text x="740" y="454" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="bold">4</text>
  <rect x="752" y="442" width="172" height="18" fill="#bd93f9" rx="3"/>
  <text x="838" y="455" text-anchor="middle" fill="white" font-family="monospace" font-size="11">Transaction ledger</text>
</svg>
