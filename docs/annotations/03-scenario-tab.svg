<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- annotation overlay only — composited onto raw PNG via magick composite -->

  <!-- 1: Scenarios list -->
  <rect x="57" y="93" width="530" height="425" fill="rgba(80,250,123,0.10)" stroke="#50fa7b" stroke-width="2" rx="2"/>
  <circle cx="70" cy="120" r="11" fill="#50fa7b"/>
  <text x="70" y="124" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="12" font-weight="bold">1</text>
  <rect x="82" y="112" width="184" height="18" fill="#50fa7b" rx="3"/>
  <text x="174" y="125" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="11">All scenarios (Enter=switch)</text>

  <!-- 2: Comparison table -->
  <rect x="591" y="93" width="800" height="165" fill="rgba(139,233,253,0.10)" stroke="#8be9fd" stroke-width="2" rx="2"/>
  <circle cx="604" cy="120" r="11" fill="#8be9fd"/>
  <text x="604" y="124" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="12" font-weight="bold">2</text>
  <rect x="616" y="112" width="210" height="18" fill="#8be9fd" rx="3"/>
  <text x="721" y="125" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="11">Side-by-side MC comparison</text>

  <!-- 3: Net Worth Overlay chart -->
  <rect x="591" y="262" width="800" height="473" fill="rgba(255,184,108,0.10)" stroke="#ffb86c" stroke-width="2" rx="2"/>
  <circle cx="604" cy="290" r="11" fill="#ffb86c"/>
  <text x="604" y="294" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="12" font-weight="bold">3</text>
  <rect x="616" y="282" width="198" height="18" fill="#ffb86c" rx="3"/>
  <text x="715" y="295" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="11">Net worth overlay chart</text>

  <!-- 4: Selected scenario details -->
  <rect x="57" y="523" width="530" height="148" fill="rgba(189,147,249,0.10)" stroke="#bd93f9" stroke-width="2" rx="2"/>
  <circle cx="70" cy="550" r="11" fill="#bd93f9"/>
  <text x="70" y="554" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="bold">4</text>
  <rect x="82" y="542" width="178" height="18" fill="#bd93f9" rx="3"/>
  <text x="171" y="555" text-anchor="middle" fill="white" font-family="monospace" font-size="11">Selected scenario details</text>

  <!-- 5: Errors panel -->
  <rect x="57" y="675" width="530" height="90" fill="rgba(255,85,85,0.10)" stroke="#ff5555" stroke-width="2" rx="2" stroke-dasharray="5,3"/>
  <circle cx="70" cy="700" r="11" fill="#ff5555"/>
  <text x="70" y="704" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="bold">5</text>
  <rect x="82" y="692" width="166" height="18" fill="#ff5555" rx="3"/>
  <text x="165" y="705" text-anchor="middle" fill="white" font-family="monospace" font-size="11">Simulation error log</text>
</svg>
