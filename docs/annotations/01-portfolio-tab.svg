<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- annotation overlay only — composited onto raw PNG via magick composite -->

  <!-- 1: Tab navigation bar -->
  <rect x="13" y="13" width="820" height="22" fill="rgba(255,107,107,0.25)" stroke="#ff6b6b" stroke-width="2" rx="2"/>
  <circle cx="25" cy="60" r="11" fill="#ff6b6b"/>
  <text x="25" y="64" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="bold">1</text>
  <line x1="25" y1="49" x2="25" y2="35" stroke="#ff6b6b" stroke-width="1.5"/>
  <rect x="36" y="52" width="182" height="18" fill="#ff6b6b" rx="3"/>
  <text x="127" y="65" text-anchor="middle" fill="white" font-family="monospace" font-size="11">Tab navigation (keys 1–5)</text>

  <!-- 2: Portfolio Overview bar chart -->
  <rect x="13" y="37" width="1380" height="88" fill="rgba(139,233,253,0.15)" stroke="#8be9fd" stroke-width="2" rx="2"/>
  <circle cx="1430" cy="58" r="11" fill="#8be9fd"/>
  <text x="1430" y="62" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="12" font-weight="bold">2</text>
  <line x1="1419" y1="58" x2="1395" y2="58" stroke="#8be9fd" stroke-width="1.5"/>
  <rect x="1440" y="50" width="152" height="18" fill="#8be9fd" rx="3"/>
  <text x="1516" y="63" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="11">Portfolio overview</text>

  <!-- 3: Accounts panel -->
  <rect x="13" y="128" width="385" height="178" fill="rgba(80,250,123,0.12)" stroke="#50fa7b" stroke-width="2" rx="2"/>
  <circle cx="26" cy="155" r="11" fill="#50fa7b"/>
  <text x="26" y="159" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="12" font-weight="bold">3</text>
  <rect x="38" y="147" width="130" height="18" fill="#50fa7b" rx="3"/>
  <text x="103" y="160" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="11">Account balances</text>

  <!-- 4: Return Profiles panel -->
  <rect x="401" y="128" width="565" height="178" fill="rgba(255,184,108,0.12)" stroke="#ffb86c" stroke-width="2" rx="2"/>
  <circle cx="413" cy="155" r="11" fill="#ffb86c"/>
  <text x="413" y="159" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="12" font-weight="bold">4</text>
  <rect x="425" y="147" width="168" height="18" fill="#ffb86c" rx="3"/>
  <text x="509" y="160" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="11">Return profile browser</text>

  <!-- 5: Distribution chart -->
  <rect x="969" y="128" width="619" height="178" fill="rgba(189,147,249,0.12)" stroke="#bd93f9" stroke-width="2" rx="2"/>
  <circle cx="981" cy="155" r="11" fill="#bd93f9"/>
  <text x="981" y="159" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="bold">5</text>
  <rect x="993" y="147" width="172" height="18" fill="#bd93f9" rx="3"/>
  <text x="1079" y="160" text-anchor="middle" fill="white" font-family="monospace" font-size="11">Return distribution</text>

  <!-- 6: Mappings panel -->
  <rect x="13" y="309" width="385" height="230" fill="rgba(255,184,108,0.10)" stroke="#ffb86c" stroke-width="2" rx="2" stroke-dasharray="5,3"/>
  <circle cx="26" cy="335" r="11" fill="#ffb86c"/>
  <text x="26" y="339" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="12" font-weight="bold">6</text>
  <rect x="38" y="327" width="148" height="18" fill="#ffb86c" rx="3"/>
  <text x="112" y="340" text-anchor="middle" fill="#282a36" font-family="monospace" font-size="11">Ticker → profile map</text>

  <!-- 7: Tax & Inflation -->
  <rect x="401" y="309" width="1186" height="230" fill="rgba(255,85,85,0.10)" stroke="#ff5555" stroke-width="2" rx="2" stroke-dasharray="5,3"/>
  <circle cx="413" cy="335" r="11" fill="#ff5555"/>
  <text x="413" y="339" text-anchor="middle" fill="white" font-family="monospace" font-size="12" font-weight="bold">7</text>
  <rect x="425" y="327" width="168" height="18" fill="#ff5555" rx="3"/>
  <text x="509" y="340" text-anchor="middle" fill="white" font-family="monospace" font-size="11">Tax &amp; inflation config</text>
</svg>
